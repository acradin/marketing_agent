[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "apscheduler>=3.10,<4", "httpx>=0.27,<1", "pydantic-settings>=2,<3", "yt-dlp>=2025.1", "tweepy>=4.14,<5"]

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.49"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
