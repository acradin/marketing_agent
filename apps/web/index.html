<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Viral Engine</title>
<style>
:root{font:15px system-ui,sans-serif;color:#e5edf5;background:#0c121b;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;border-bottom:1px solid #293448;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}small,.muted{color:#a9b8ca}main{max-width:1300px;margin:auto;padding:26px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button,input,select,textarea{font:inherit;border:1px solid #3d4c63;border-radius:7px;padding:10px;background:#172233;color:inherit}button{cursor:pointer}button:hover,button.active{background:#29443d;border-color:#65dfae}button:disabled{opacity:.5;cursor:wait}input,textarea,select{width:100%}label{display:block;margin:14px 0 6px}.grid{display:grid;grid-template-columns:330px 1fr;gap:24px}.card{padding:20px;background:#131e2c;border:1px solid #293448;border-radius:12px;margin-bottom:14px}.card h2{font-size:18px;margin-top:0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;font-size:12px;background:#253549;padding:4px 8px;border-radius:20px;margin-right:8px}.good{color:#65dfae}.warn{color:#ffc87b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace;max-height:400px;overflow:auto}a{color:#8dddc3}#message{position:sticky;top:0;padding:12px;background:#253549;z-index:5;display:none}.text{white-space:pre-wrap;overflow-wrap:anywhere}textarea{min-height:160px}details{margin-top:12px}footer{padding:24px;text-align:center;color:#a9b8ca}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:16px}header{align-items:flex-start;gap:16px}}
</style></head><body><header><div><h1>Viral Engine <span class="good">↗</span></h1><small>콘텐츠를 발견하고, 가설을 세우고, 실제 반응을 기록하세요.</small></div><span class="badge">LOCAL · v0.1.0</span></header><main><div id="message" role="status"></div><nav id="nav"></nav><div id="content"></div></main><footer>관측 데이터와 모델 가설을 구분합니다. 모든 외부 발행은 검토와 승인이 필요합니다.</footer>
<script>
const tabs=['발견','게시물','패턴·생성','검토·발행','실험 결과','작업 기록'];let tab=0;let patterns=[];
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=o=>'<pre>'+esc(JSON.stringify(o,null,2))+'</pre>';
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-Viral-Local':'1'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function notify(text){const e=document.querySelector('#message');e.textContent=text;e.style.display='block'}
async function action(fn){try{await fn()}catch(e){notify(e.message)}}
function formData(id){return Object.fromEntries(new FormData(document.getElementById(id)))}
function bind(id,fn){document.getElementById(id)?.addEventListener('submit',e=>{e.preventDefault();action(()=>fn(formData(id)))})}
async function queue(path,body){const r=await api(path,'POST',body);notify('작업 등록: '+r.job_id+' · 작업 기록에서 결과를 확인하세요.')}
async function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'active':''}" data-tab="${i}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);action(render)});const out=document.getElementById('content');
if(tab===0){const s=await api('status');out.innerHTML=`<div class="grid"><div><form id="discover" class="card"><h2>공개 게시물 검색</h2><label for="platform">플랫폼</label><select id="platform" name="platform"><option value="reddit">Reddit</option><option value="youtube">YouTube</option><option value="x">X (최근 7일)</option><option value="instagram">Instagram (내 계정, * 전체)</option></select><label for="query">키워드</label><input id="query" name="query" required placeholder="AI coding"><label for="days">최근 기간 (일)</label><input id="days" name="days" type="number" min="1" max="365" value="7"><input name="limit" type="hidden" value="25"><div class="row"><button>수집 작업 시작</button></div></form><form id="url" class="card"><h2>개별 영상 URL</h2><p class="muted">허용된 공개 TikTok·YouTube 영상의 메타데이터만 수집합니다.</p><label for="urlvalue">영상 URL</label><input id="urlvalue" name="url" type="url" required><div class="row"><button>URL 수집</button></div></form></div><div><h2>연결 상태</h2>${s.adapters.map(a=>`<article class="card"><h2>${esc(a.platform)} <span class="badge ${a.configured?'good':'warn'}">${a.configured?'설정됨 · 연결 검증 필요':'설정 필요'}</span></h2><p>${esc(a.constraints)}</p><p class="muted">인증: ${esc(a.auth)} · 수집 지표: ${esc(a.metrics.join(', '))}</p><p>실측 성공률: ${a.success_rate===null?'관측 없음':Math.round(a.success_rate*100)+'%'} · 마지막 성공: ${esc(a.last_success)}</p>${a.last_failure?'<p class="warn">'+esc(a.last_failure)+'</p>':''}</article>`).join('')}<p>LLM: ${s.llm_configured?'설정됨':'설정 필요'} · 외부 발행: ${s.publishing_enabled?'활성화':'비활성화'}</p></div></div>`;bind('discover',d=>queue('discover',{...d,days:Number(d.days),limit:Number(d.limit)}));bind('url',d=>queue('collect-url',d));}
if(tab===1){const rows=await api('posts');out.innerHTML='<h2>수집 게시물</h2>'+ (rows.length?rows.map(p=>`<article class="card"><span class="badge">${esc(p.platform)}</span><a href="${esc(p.canonical_url)}" target="_blank" rel="noopener noreferrer">원본 보기 ↗</a><p class="text">${esc(p.text?.slice(0,1200))}</p><small>게시: ${esc(p.published_at)} · 최초 수집: ${esc(p.collected_at)} · 관측 ${p.snapshots.length}회</small><p>순위 상태: ${esc(p.ranking.status)} · 비교 표본: ${p.ranking.sample_size}</p><div class="row"><button data-observe="${p.id}">지표 다시 수집</button><button data-analyze="${p.id}">구조 분석</button></div><details><summary>점수와 실제 스냅샷</summary>${json({ranking:p.ranking,snapshots:p.snapshots})}</details></article>`).join(''):'<p class="muted">아직 수집된 게시물이 없습니다. 발견 탭에서 검색하거나 URL을 입력하세요.</p>');document.querySelectorAll('[data-observe]').forEach(b=>b.onclick=()=>action(()=>queue('posts/'+b.dataset.observe+'/observe',{})));document.querySelectorAll('[data-analyze]').forEach(b=>b.onclick=()=>action(()=>queue('posts/'+b.dataset.analyze+'/analyze',{})));}
if(tab===2){patterns=await api('patterns');const analyses=await api('analyses');out.innerHTML=`<div class="grid"><form id="generate" class="card"><h2>새 콘텐츠 생성</h2><label for="pattern">패턴</label><select id="pattern" name="pattern_id" required>${patterns.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label for="product">제품</label><input id="product" name="product" required><label for="audience">타깃 고객</label><input id="audience" name="audience" required><label for="facts">사용 가능한 사실·제품 설명</label><textarea id="facts" name="facts" required></textarea><label for="dest">발행 대상 (Reddit: 서브레딧 / X·Instagram: 계정 ID)</label><input id="dest" name="destination"><label for="gen-platform">발행 플랫폼</label><select id="gen-platform" name="platform"><option value="reddit">Reddit</option><option value="x">X 텍스트</option><option value="instagram">Instagram 단일 이미지</option><option value="tiktok">TikTok 수동 내보내기</option><option value="youtube">YouTube 수동 내보내기</option><option value="manual">수동</option></select><label for="image">Instagram 공개 JPEG URL</label><input id="image" name="image_url" type="url"><input type="hidden" name="language" value="ko"><div class="row"><button ${patterns.length?'':'disabled'}>초안 생성</button></div></form><div><h2>패턴 라이브러리</h2>${patterns.length?patterns.map(p=>`<article class="card"><h2>${esc(p.name)}</h2><p>근거 게시물 ${p.example_post_ids.length}개 · ${esc(p.platform)}</p>${json(p.structure)}<details><summary>모델 가설 확인</summary>${json(analyses.find(a=>a.id===p.analysis_id)?.result)}</details></article>`).join(''):'<p class="muted">게시물 구조 분석을 실행하면 패턴이 나타납니다.</p>'}</div></div>`;bind('generate',d=>queue('generate',d));}
if(tab===3){const rows=await api('drafts');out.innerHTML='<h2>검토 및 발행</h2><p class="muted">수정하면 기존 승인은 취소됩니다. 승인 후에도 발행 버튼을 별도로 눌러야 합니다.</p>'+ (rows.length?rows.map(d=>`<form id="draft-${d.id}" class="card"><span class="badge">${esc(d.state)}</span><span>버전 ${d.version}</span><label for="title-${d.id}">제목</label><input id="title-${d.id}" name="title" value="${esc(d.title)}"><label for="text-${d.id}">본문</label><textarea id="text-${d.id}" name="text">${esc(d.text)}</textarea><label for="dest-${d.id}">발행 대상 (${esc(d.platform)})</label><input id="dest-${d.id}" name="destination" value="${esc(d.destination)}"><label for="image-${d.id}">Instagram 공개 JPEG URL</label><input id="image-${d.id}" name="image_url" value="${esc(d.brief.image_url || '')}"><div class="row"><a href="/api/drafts/${d.id}/export">저장본 JSON 내보내기</a>${['review','approved'].includes(d.state)?`<button>수정 저장</button><button type="button" data-approve="${d.id}">현재 저장본 승인</button>`:''}${d.state==='approved' && ['reddit','x','instagram'].includes(d.platform)?`<button type="button" data-publish="${d.id}">승인된 저장본 외부 발행</button>`:''}${d.remote_url?`<a href="${esc(d.remote_url)}" target="_blank" rel="noopener">발행 원본</a>`:''}</div></form>`).join(''):'<p class="muted">생성된 초안이 없습니다.</p>');rows.forEach(d=>bind('draft-'+d.id,async v=>{await api('drafts/'+d.id,'PUT',{...v,version:d.version});notify('수정 저장됨 · 재승인 필요');await render()}));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>action(async()=>{const d=rows.find(x=>x.id===b.dataset.approve);const f=formData('draft-'+d.id);if(f.text!==d.text||f.title!==d.title||f.destination!==d.destination||f.image_url!==(d.brief.image_url||''))throw Error('변경 내용을 먼저 저장하세요.');await api('drafts/'+d.id+'/approve','POST',{version:d.version});await render()}));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>action(async()=>{const d=rows.find(x=>x.id===b.dataset.publish);const f=formData('draft-'+d.id);if(f.text!==d.text||f.title!==d.title||f.destination!==d.destination||f.image_url!==(d.brief.image_url||''))throw Error('변경 내용을 먼저 저장하고 다시 승인하세요.');if(!confirm('승인한 저장본을 '+d.platform+' / '+d.destination+'에 실제로 발행할까요?'))return;await api('drafts/'+d.id+'/publish','POST',{});notify('발행 완료');await render()}));}
if(tab===4){const rows=await api('feedback/results');out.innerHTML='<h2>실험 결과</h2><p class="muted">발행 초안 → 패턴 → 실제 게시물 성과를 연결합니다. 관찰 결과는 인과 효과의 증명이 아닙니다.</p>'+(rows.length?rows.map(r=>'<article class="card">'+json(r)+'</article>').join(''):'<p>발행 후 관측 결과가 여기에 표시됩니다.</p>');}
if(tab===5){const rows=await api('jobs');const events=await api('events');out.innerHTML='<h2>작업 기록</h2><button id="refresh">새로고침</button>'+rows.reverse().map(j=>`<article class="card"><span class="badge">${esc(j.state)}</span><b>${esc(j.kind)}</b><p>시도 ${j.attempts}/3 · 실행 예정 ${esc(j.run_at)}</p>${j.error?'<p class="warn">'+esc(j.error)+'</p>':''}<details><summary>입력과 결과</summary>${json(j)}</details></article>`).join('')+'<details><summary>감사 기록</summary>'+json(events)+'</details>';document.getElementById('refresh').onclick=()=>action(render);}
}
const originalRender=render;
render=async function(){
 await originalRender();
 const out=document.getElementById('content');
 if(tab===4){const rows=await api('feedback/learning');out.insertAdjacentHTML('beforeend','<h2>다음 실험을 위한 관측 요약</h2>'+rows.map(r=>'<article class="card"><h2>'+esc(r.name)+'</h2><p>'+esc(r.recommendation)+' · 비교 가능한 실험 '+r.comparable_experiments+'개</p>'+json(r)+'</article>').join(''));}
 if(tab===0){const rows=await api('schedules');out.insertAdjacentHTML('beforeend',`<section class="card"><h2>정기 검색</h2><p class="muted">위 검색 조건으로 반복 수집합니다. 앱이 실행 중일 때 동작하며, 재시작하면 예약을 복구합니다.</p><label for="interval">간격 (분, 최소 60)</label><input id="interval" type="number" min="60" max="10080" value="360"><div class="row"><button id="schedule-add">현재 검색 조건 예약</button></div>${rows.filter(r=>r.enabled).map(r=>`<p>${esc(r.payload.platform)} · ${esc(r.payload.query)} · ${r.interval_minutes}분 <button data-stop="${r.id}">예약 중단</button></p>`).join('')}</section>`);document.getElementById('schedule-add').onclick=()=>action(async()=>{const d=formData('discover');await api('schedules','POST',{...d,days:Number(d.days),limit:Number(d.limit),interval_minutes:Number(document.getElementById('interval').value)});notify('정기 검색 예약됨');await render()});document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>action(async()=>{await api('schedules/'+b.dataset.stop,'DELETE');await render()}));}
};
action(render);
</script></body></html>
