<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Viral Engine</title>
<style>
:root{font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242728;background:#fafaf9;color-scheme:light;--line:#e5e7e5;--muted:#686e6b;--accent:#24694f}
*{box-sizing:border-box}body{margin:0}header{max-width:1120px;margin:auto;padding:30px 32px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:20px;font-weight:650;letter-spacing:-.6px;margin:0}h2{font-size:17px;font-weight:600;letter-spacing:-.4px;margin:0 0 14px}h1 .good{display:none}header small{display:block;margin-top:4px}small,.muted{color:var(--muted);font-size:12px}p{margin:10px 0}main{max-width:1120px;margin:auto;padding:0 32px 40px}nav{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:32px;overflow-x:auto}button,input,select,textarea{font:inherit;border:1px solid #d7dcd8;border-radius:6px;padding:9px 12px;background:#fff;color:inherit}button{cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}button:hover{background:#f0f2ef;border-color:#aeb7b0}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}input:focus,select:focus,textarea:focus{outline:2px solid #24694f55;outline-offset:1px;border-color:var(--accent)}nav button{flex-shrink:0;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:13px 0;color:var(--muted);font-size:13px}nav button:hover{background:transparent;color:#242728}nav button.active{color:#202623;border-bottom-color:#202623}input,textarea,select{width:100%;min-width:0}label{display:block;margin:18px 0 6px;font-size:12px;font-weight:500;color:#525a55}.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:40px;align-items:start}.grid>*,.card{min-width:0}.card{padding:24px;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:16px}.card h2{font-size:15px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.row a{font-size:12px;margin-right:auto}form .row>button:not([type]),form .row>button[type=submit]{background:#293e33;color:#fff;border-color:#293e33}form .row>button:not([type]):hover{background:#1b3025}.badge{display:inline-block;font-size:11px;font-weight:500;background:#f1f3f0;color:#5b655e;padding:3px 8px;border-radius:4px;margin-right:6px;vertical-align:middle}.good{color:#24694f}.warn{color:#8a5b18}.badge.good{background:#edf5ef}.badge.warn{background:#faf3e8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 ui-monospace,monospace;max-height:360px;overflow:auto;background:#f7f8f5;padding:16px;border-radius:5px}a{color:var(--accent);text-underline-offset:3px}#message{position:sticky;top:12px;padding:12px 16px;border:1px solid #d4e2d6;border-radius:6px;background:#f0f6ef;z-index:5;display:none;margin-bottom:16px}.text{white-space:pre-wrap;overflow-wrap:anywhere}textarea{min-height:160px;resize:vertical}details{margin-top:16px}summary{cursor:pointer;font-size:12px;color:var(--muted)}details[open]>summary{margin-bottom:12px}footer{max-width:1056px;margin:auto;padding:20px 24px 32px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center}.connection{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 0;margin:0}.connection h2{display:flex;justify-content:space-between;align-items:center;margin:0;text-transform:capitalize}.connection details{margin-top:8px}#gen-channel-summary{margin-top:20px;padding:16px;background:#f7f8f5;border-radius:6px}#gen-channel-summary h2{font-size:13px}#post-count{font-size:12px;color:var(--muted)}#refresh{margin-bottom:20px}#interval{max-width:200px}#content>form{max-width:800px}#content>.card:has(#post-query-filter){padding:16px 20px;max-width:520px}#content>.card:has(#post-query-filter) label{margin-top:0}#content>details.card{margin-top:24px}#content>details.card>summary{font-size:14px;color:#242728;font-weight:500}
@media(max-width:800px){header{padding:24px 20px 20px}header>.badge{display:none}main{padding:0 20px 28px}nav{gap:22px;margin-bottom:24px}.grid{grid-template-columns:1fr;gap:24px}.card{padding:20px}footer{margin:0 20px;padding:20px 0}.row{gap:8px}h1{font-size:19px}}
</style></head><body><header><div><h1>Viral Engine <span class="good">↗</span></h1><small>발견부터 발행까지, 한곳에서.</small></div><span class="badge">워크스페이스 · 로컬</span></header><main><div id="message" role="status"></div><nav id="nav" aria-label="주 메뉴"></nav><div id="content"></div></main><footer>관측 데이터와 모델 가설을 구분합니다. 모든 외부 발행은 검토와 승인이 필요합니다.</footer>
<script>
const tabs=['발견','게시물','패턴·생성','검토·발행','실험 결과','작업 기록'];let tab=0;let patterns=[];let postQueryFilter='all';
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channels={reddit:{name:'Reddit',format:'제목 + 본문',destination:'서브레딧 이름',direct:true},x:{name:'X',format:'텍스트 게시물',destination:'X 계정 ID',direct:true},instagram:{name:'Instagram',format:'이미지 1장 + 캡션',destination:'Instagram 프로 계정 ID',direct:true},youtube:{name:'YouTube',format:'초안 JSON',destination:'게시할 채널 (메모)'},tiktok:{name:'TikTok',format:'초안 JSON',destination:'게시할 계정 (메모)'},manual:{name:'수동 게시',format:'초안 JSON',destination:'게시할 곳 (메모)'}};
const channel=p=>channels[p]||{name:p,format:'초안 JSON',destination:'게시할 곳 (메모)'};
function channelSummary(p){const c=channel(p);return `<h2>발행 채널 · ${esc(c.name)}</h2><span class="badge">${esc(c.format)}</span><span class="badge ${c.direct?'good':'warn'}">${c.direct?'앱에서 직접 발행 지원':'수동 게시 · JSON 내보내기만'}</span><p class="muted">${c.direct?'발행하려면 채널별 인증 설정과 일치하는 발행 대상이 필요합니다.':'JSON을 내려받아 해당 서비스에서 직접 게시하세요. 영상 업로드는 지원하지 않습니다.'}</p>`}
function updateGenerateChannel(){const p=document.getElementById('gen-platform').value,c=channel(p);document.getElementById('gen-channel-summary').innerHTML=channelSummary(p);document.querySelector('label[for="dest"]').textContent=c.destination;document.getElementById('gen-image-fields').hidden=p!=='instagram';document.getElementById('image').disabled=p!=='instagram';}
const json=o=>'<pre>'+esc(JSON.stringify(o,null,2))+'</pre>';
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json','X-Viral-Local':'1'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function notify(text){const e=document.querySelector('#message');e.textContent=text;e.style.display='block'}
async function action(fn){try{await fn()}catch(e){notify(e.message)}}
function formData(id){return Object.fromEntries(new FormData(document.getElementById(id)))}
function bind(id,fn){document.getElementById(id)?.addEventListener('submit',e=>{e.preventDefault();action(()=>fn(formData(id)))})}
async function queue(path,body){const r=await api(path,'POST',body);notify('작업 등록: '+r.job_id+' · 작업 기록에서 결과를 확인하세요.')}
async function connectX(){
 const info=await api('connections/x');
 document.getElementById('x-flow').innerHTML=`<p>${info.connected?'연결된 X 계정 ID: '+esc(info.user_id):'X 계정으로 로그인하고 읽기·게시 권한을 승인하세요.'}</p><p>X 개발자 앱에 아래 콜백 URL을 등록하세요.</p><pre>${esc(info.redirect_uri)}</pre>${info.app_configured?'':'<p class="warn">X OAuth 2.0 Client ID 설정이 필요합니다. 서버의 .env에 VE_X_CLIENT_ID를 넣으세요. Web App은 VE_X_CLIENT_SECRET도 필요합니다.</p>'}<p>승인하면 자동으로 이 화면으로 돌아옵니다. 연결만으로 글이 발행되지는 않습니다.</p><button id="x-start" type="button" ${info.app_configured?'':'disabled'}>X에서 로그인·권한 승인</button>`;
 document.getElementById('x-start').onclick=()=>action(async()=>{const r=await api('connections/x/start','POST',{});window.location.assign(r.authorization_url);});
}
const xOutcome=new URLSearchParams(location.search).get('x_connection');
if(xOutcome){history.replaceState(null,'',location.pathname);notify(xOutcome==='connected'?'X 연결 완료 · 로그인한 계정이 저장되었습니다.':xOutcome==='denied'?'X 권한 승인을 취소했습니다. 다시 연결할 수 있습니다.':'X 연결에 실패했습니다. 앱 설정·콜백 URL을 확인하고 다시 연결하세요.');}
async function connectInstagram(){
 const info=await api('connections/instagram');
 const el=document.getElementById('ig-flow');
 el.innerHTML=`<p>Meta 앱의 Instagram 로그인 설정에 아래 리디렉션 URI를 등록하세요.</p><pre>${esc(info.redirect_uri)}</pre><p>비즈니스·크리에이터 계정으로 승인한 뒤, 이동한 주소 전체를 아래에 붙여 넣으세요. localhost 연결 오류가 보여도 주소창의 주소를 복사하면 됩니다. 10분 안에 완료하세요.</p><button id="ig-start" type="button">로그인 준비</button><div id="ig-login"></div><form id="ig-complete"><label for="ig-callback">승인 후 돌아온 주소</label><input id="ig-callback" name="callback_url" type="url" autocomplete="off" required><div class="row"><button>연결 완료</button></div></form>`;
 document.getElementById('ig-start').onclick=()=>action(async()=>{const r=await api('connections/instagram/start','POST',{});document.getElementById('ig-login').innerHTML=`<p><a href="${esc(r.authorization_url)}" target="_blank" rel="noopener noreferrer">Instagram에서 로그인·권한 승인</a></p>`;});
 bind('ig-complete',async d=>{document.getElementById('ig-callback').value='';const r=await api('connections/instagram/complete','POST',d);notify('Instagram 연결 완료 · '+(r.username||r.user_id));await render();});
}
async function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'active':''}" aria-current="${i===tab?'page':'false'}" data-tab="${i}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);action(render)});const out=document.getElementById('content');
if(tab===0){const s=await api('status');out.innerHTML=`<div class="grid"><div><form id="discover" class="card"><h2>공개 게시물 검색</h2><label for="platform">플랫폼</label><select id="platform" name="platform"><option value="youtube">YouTube</option><option value="x">X (최근 7일)</option><option value="instagram">Instagram (내 계정, * 전체)</option></select><label for="query">키워드</label><input id="query" name="query" required placeholder="AI coding"><label for="days">최근 기간 (일)</label><input id="days" name="days" type="number" min="1" max="365" value="7"><input name="limit" type="hidden" value="25"><div class="row"><button>수집 작업 시작</button></div></form><form id="url" class="card"><h2>개별 영상 URL</h2><p class="muted">허용된 공개 TikTok·YouTube 영상의 메타데이터만 수집합니다.</p><label for="urlvalue">영상 URL</label><input id="urlvalue" name="url" type="url" required><div class="row"><button>URL 수집</button></div></form></div><div><h2>연결 상태</h2><p class="muted">최근 수집 기록 기준 · 상세에서 마지막 성공 시각 확인</p>${s.adapters.filter(a=>!['reddit','public_video'].includes(a.platform)).map(a=>`<article class="card connection"><h2>${esc(a.platform)} <span class="badge ${a.configured?'good':'warn'}">${a.configured?(a.last_success?'연결 확인됨':'설정됨 · 수집 전'):'설정 필요'}</span></h2><details><summary>연결 상세</summary><p>${esc(a.constraints)}</p><p class="muted">인증: ${esc(a.auth)} · 수집 지표: ${esc(a.metrics.join(', '))}</p><p>실측 성공률: ${a.success_rate===null?'관측 없음':Math.round(a.success_rate*100)+'%'} · 마지막 성공: ${esc(a.last_success)}</p>${a.platform==='x'?'<div class="row"><button type="button" id="x-connect">X 연결</button></div><div id="x-flow"></div>':''}${a.platform==='instagram'?'<div class="row"><button type="button" id="ig-connect">Instagram 연결</button></div><div id="ig-flow"></div>':''}${a.last_failure?'<p class="warn">'+esc(a.last_failure)+'</p>':''}</details></article>`).join('')}<p>LLM: ${s.llm_configured?'설정됨':'설정 필요'} · 외부 발행: ${s.publishing_enabled?'활성화':'비활성화'}</p></div></div>`;bind('discover',d=>queue('discover',{...d,days:Number(d.days),limit:Number(d.limit)}));bind('url',d=>queue('collect-url',d));document.getElementById('x-connect').onclick=()=>action(connectX);document.getElementById('ig-connect').onclick=()=>action(connectInstagram);}
if(tab===1){
 const [rows,jobs]=await Promise.all([api('posts'),api('jobs')]);
 const queriesByPost=new Map(rows.map(p=>[p.id,new Set()]));
 for(const job of jobs){if(job.kind!=='discover'||job.state!=='succeeded'||!job.payload?.query)continue;for(const id of job.result?.post_ids||[])queriesByPost.get(id)?.add(job.payload.query);}
 const counts=new Map();for(const queries of queriesByPost.values())for(const query of queries)counts.set(query,(counts.get(query)||0)+1);
 const choices=[{value:'all',label:'전체 게시물',count:rows.length},{value:'unknown',label:'검색어 기록 없음',count:rows.filter(p=>!queriesByPost.get(p.id).size).length},...Array.from(counts).sort((a,b)=>a[0].localeCompare(b[0],'ko')).map(([q,count])=>({value:'query:'+q,label:q,count}))];
 if(!choices.some(c=>c.value===postQueryFilter))postQueryFilter='all';
 out.innerHTML=`<h2>수집 게시물</h2><p class="muted">수집할 때 사용한 검색어로 모아 봅니다. 여러 검색어로 수집된 게시물은 각각의 검색어에 포함됩니다.</p><section class="card"><label for="post-query-filter">수집 검색어</label><select id="post-query-filter">${choices.map(c=>`<option value="${esc(c.value)}" ${c.value===postQueryFilter?'selected':''}>${esc(c.label)} (${c.count}건)</option>`).join('')}</select><p class="muted">검색어 기록 없음에는 URL로 직접 수집했거나 연결된 검색 기록이 없는 게시물이 포함됩니다.</p></section><p id="post-count" role="status"></p><div id="post-results"></div>`;
 function showPosts(){
  const filtered=rows.filter(p=>postQueryFilter==='all'||(postQueryFilter==='unknown'?!queriesByPost.get(p.id).size:queriesByPost.get(p.id).has(postQueryFilter.slice(6))));
  document.getElementById('post-count').textContent=choices.find(c=>c.value===postQueryFilter).label+' · '+filtered.length+'건 / 전체 '+rows.length+'건';
  document.getElementById('post-results').innerHTML=filtered.length?filtered.map(p=>`<article class="card"><span class="badge">${esc(p.platform)}</span><a href="${esc(p.canonical_url)}" target="_blank" rel="noopener noreferrer">원본 보기 ↗</a><p>수집 검색어: ${queriesByPost.get(p.id).size?Array.from(queriesByPost.get(p.id)).map(q=>`<span class="badge">${esc(q)}</span>`).join(''):'<span class="muted">기록 없음</span>'}</p><p class="text">${esc(p.text?.slice(0,1200))}</p><small>게시: ${esc(p.published_at)} · 최초 수집: ${esc(p.collected_at)} · 관측 ${p.snapshots.length}회</small><p>순위 상태: ${esc(p.ranking.status)} · 비교 표본: ${p.ranking.sample_size}</p><div class="row"><button data-observe="${p.id}">지표 다시 수집</button><button data-analyze="${p.id}">구조 분석</button></div><details><summary>점수와 실제 스냅샷</summary>${json({ranking:p.ranking,snapshots:p.snapshots})}</details></article>`).join(''):'<p class="muted">이 검색어에 해당하는 게시물이 없습니다. 발견 탭에서 검색하거나 다른 검색어를 선택하세요.</p>';
  document.querySelectorAll('[data-observe]').forEach(b=>b.onclick=()=>action(()=>queue('posts/'+b.dataset.observe+'/observe',{})));
  document.querySelectorAll('[data-analyze]').forEach(b=>b.onclick=()=>action(()=>queue('posts/'+b.dataset.analyze+'/analyze',{})));
 }
 document.getElementById('post-query-filter').onchange=e=>{postQueryFilter=e.target.value;showPosts()};showPosts();
}
if(tab===2){patterns=await api('patterns');const analyses=await api('analyses');out.innerHTML=`<div class="grid"><form id="generate" class="card"><h2>새 콘텐츠 생성</h2><label for="pattern">패턴</label><select id="pattern" name="pattern_id" required>${patterns.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><label for="product">제품</label><input id="product" name="product" required><label for="audience">타깃 고객</label><input id="audience" name="audience" required><label for="facts">사용 가능한 사실·제품 설명</label><textarea id="facts" name="facts" required></textarea><label for="gen-platform">어디에 게시할까요?</label><select id="gen-platform" name="platform"><option value="x">X 텍스트</option><option value="instagram">Instagram 단일 이미지</option><option value="tiktok">TikTok 수동 내보내기</option><option value="youtube">YouTube 수동 내보내기</option><option value="manual">수동</option></select><div id="gen-channel-summary" aria-live="polite"></div><label for="dest">발행 대상</label><input id="dest" name="destination"><div id="gen-image-fields"><label for="image">Instagram 공개 HTTPS JPEG URL</label><input id="image" name="image_url" type="url"></div><input type="hidden" name="language" value="ko"><div class="row"><button ${patterns.length?'':'disabled'}>초안 생성</button></div></form><div><h2>패턴 라이브러리</h2>${patterns.length?patterns.map(p=>`<article class="card"><h2>${esc(p.name)}</h2><p>근거 게시물 ${p.example_post_ids.length}개 · ${esc(p.platform)}</p><details><summary>패턴 구조</summary>${json(p.structure)}</details><details><summary>모델 가설 확인</summary>${json(analyses.find(a=>a.id===p.analysis_id)?.result)}</details></article>`).join(''):'<p class="muted">게시물 구조 분석을 실행하면 패턴이 나타납니다.</p>'}</div></div>`;document.getElementById('gen-platform').onchange=updateGenerateChannel;updateGenerateChannel();bind('generate',d=>queue('generate',d));}
if(tab===3){const rows=await api('drafts');const status=await api('status');out.innerHTML=`<h2>검토 및 발행</h2><p class="${status.publishing_enabled?'good':'warn'}">외부 발행 ${status.publishing_enabled?'활성화 · 채널별 인증과 대상 확인 필요':'비활성화 · 현재는 초안 검토와 내보내기만 가능합니다'}</p>`+'<p class="muted">수정하면 기존 승인은 취소됩니다. 승인 후에도 발행 버튼을 별도로 눌러야 합니다.</p>'+ (rows.length?rows.map(d=>`<form id="draft-${d.id}" class="card">${channelSummary(d.platform)}<p><strong>저장된 발행 대상: ${esc(d.destination || '미지정')}</strong></p><span class="badge">${esc(d.state)}</span><span>버전 ${d.version}</span><label for="title-${d.id}">제목</label><input id="title-${d.id}" name="title" value="${esc(d.title)}"><label for="text-${d.id}">본문</label><textarea id="text-${d.id}" name="text">${esc(d.text)}</textarea><label for="dest-${d.id}">${esc(channel(d.platform).destination)}</label><input id="dest-${d.id}" name="destination" value="${esc(d.destination)}">${d.platform==='instagram'?`<label for="image-${d.id}">Instagram 공개 HTTPS JPEG URL</label><input id="image-${d.id}" name="image_url" type="url" value="${esc(d.brief?.image_url || '')}">`:''}<div class="row"><a href="/api/drafts/${d.id}/export">저장본 JSON 내보내기</a>${['review','approved'].includes(d.state)?`<button>수정 저장</button><button type="button" data-approve="${d.id}">현재 저장본 승인</button>`:''}${d.state==='approved' && ['reddit','x','instagram'].includes(d.platform)?`<button type="button" data-publish="${d.id}"${status.publishing_enabled?'':'disabled'}>${esc(channel(d.platform).name)}에 발행</button>`:''}${d.remote_url?`<a href="${esc(d.remote_url)}" target="_blank" rel="noopener">발행 원본</a>`:''}</div></form>`).join(''):'<p class="muted">생성된 초안이 없습니다.</p>');rows.forEach(d=>bind('draft-'+d.id,async v=>{await api('drafts/'+d.id,'PUT',{...v,version:d.version});notify('수정 저장됨 · 재승인 필요');await render()}));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>action(async()=>{const d=rows.find(x=>x.id===b.dataset.approve);const f=formData('draft-'+d.id);if(f.text!==d.text||f.title!==d.title||f.destination!==d.destination||(d.platform==='instagram' && f.image_url!==(d.brief?.image_url||'')))throw Error('변경 내용을 먼저 저장하세요.');await api('drafts/'+d.id+'/approve','POST',{version:d.version});await render()}));document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>action(async()=>{const d=rows.find(x=>x.id===b.dataset.publish);const f=formData('draft-'+d.id);if(f.text!==d.text||f.title!==d.title||f.destination!==d.destination||(d.platform==='instagram' && f.image_url!==(d.brief?.image_url||'')))throw Error('변경 내용을 먼저 저장하고 다시 승인하세요.');if(!confirm('승인한 저장본을 '+d.platform+' / '+d.destination+'에 실제로 발행할까요?'))return;await api('drafts/'+d.id+'/publish','POST',{});notify('발행 완료');await render()}));}

 await originalRender();
 const out=document.getElementById('content');

 if(tab===0){const rows=await api('schedules');out.insertAdjacentHTML('beforeend',`<details class="card"><summary>정기 검색 설정</summary><p class="muted">위 검색 조건으로 반복 수집합니다. 앱이 실행 중일 때 동작하며, 재시작하면 예약을 복구합니다.</p><label for="interval">간격 (분, 최소 60)</label><input id="interval" type="number" min="60" max="10080" value="360"><div class="row"><button id="schedule-add">현재 검색 조건 예약</button></div>${rows.filter(r=>r.enabled).map(r=>`<p>${esc(r.payload.platform)} · ${esc(r.payload.query)} · ${r.interval_minutes}분 <button data-stop="${r.id}">예약 중단</button></p>`).join('')}</details>`);document.getElementById('schedule-add').onclick=()=>action(async()=>{const d=formData('discover');await api('schedules','POST',{...d,days:Number(d.days),limit:Number(d.limit),interval_minutes:Number(document.getElementById('interval').value)});notify('정기 검색 예약됨');await render()});document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>action(async()=>{await api('schedules/'+b.dataset.stop,'DELETE');await render()}));}
